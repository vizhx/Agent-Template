[project]
name = "backend"
version = "0.1.0"
description = "Backend for the agentic chat application"
authors = [{ name = "Joshua", email = "handerjoshua14@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "django==5.2.7",
    "djangorestframework==3.16.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.1.1",
    "uv==0.2.11",
    "anthropic==0.71.0",
    "google-generativeai==0.8.5",
    "channels==4.2.2",
    "channels-redis==4.3.0",
    "daphne==4.2.0",
    "psycopg2-binary==2.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "chat"]
